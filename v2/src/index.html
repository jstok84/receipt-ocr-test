<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Receipt OCR</title>
</head>
<body>
  <div id="root"></div>

  <!-- Global OCR progress chip (hidden while idle; styled + driven by the app) -->
  <div id="ocr-progress-container" style="display:none">
    <div class="bar"><div id="ocr-progress-bar"></div></div>
    <div id="ocr-status-text">Waiting to start OCR...</div>
  </div>

  <!-- Load OpenCV.js for image preprocessing -->
  <script async src="https://docs.opencv.org/4.x/opencv.js" onload="console.log('OpenCV.js loaded')"></script>

  <!-- Your main app entry -->
  <script type="module" src="./index.js"></script>
</body>
</html>
